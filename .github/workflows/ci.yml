name: CI

on:
  push:
    branches: [main, Prism]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LastFm__ApiKey: ""
      LASTFM_API_KEY: ""
      LastFm__Mode: FixtureOnly
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start disposable PostgreSQL with a fresh password
        shell: bash
        run: |
          POSTGRES_PASSWORD=$(python3 -c 'import secrets; print(secrets.token_hex(24))')
          export POSTGRES_PASSWORD
          echo "::add-mask::$POSTGRES_PASSWORD"
          docker run --detach --name phase9-ci-postgres --env POSTGRES_PASSWORD \
            --publish 127.0.0.1:5432:5432 \
            --health-cmd 'pg_isready -U postgres' \
            --health-interval 2s --health-timeout 5s --health-retries 30 \
            postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          for phase9_attempt in {1..60}; do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' phase9-ci-postgres)" = healthy ]; then
              break
            fi
            sleep 1
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' phase9-ci-postgres)" = healthy
          printf 'LINER_PHASE1_POSTGRES=Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=%s\n' "$POSTGRES_PASSWORD" >> "$GITHUB_ENV"
      - name: Install pinned stable SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore tools and locked packages
        run: |
          dotnet tool restore
          dotnet restore 'Liner Notes.sln' --locked-mode
      - name: Build Release
        run: dotnet build 'Liner Notes.sln' -c Release --no-restore -m:1
      - name: Run full suite with PostgreSQL
        run: dotnet test 'Liner Notes.sln' -c Release --no-build --no-restore --logger trx --results-directory TestResults -m:1
      - name: Require all five projects and zero failures or skips
        run: python3 scripts/checks/phase9_test_results.py TestResults
      - name: Verify offline tools and repository controls
        run: |
          python3 -m unittest discover -s scripts -p 'test_phase*.py'
          python3 -m unittest discover -s scripts/checks -p 'test_phase9*.py'
          python3 scripts/checks/secret_defaults.py
          python3 scripts/checks/renewal_docs.py
          git diff --check
      - name: Remove disposable PostgreSQL
        if: always()
        run: |
          if docker container inspect phase9-ci-postgres >/dev/null 2>&1; then
            docker rm --force --volumes phase9-ci-postgres
          fi

  container-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify disposable local stack
        run: python3 scripts/checks/phase9_compose.py --build
