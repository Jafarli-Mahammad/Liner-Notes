<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title description">
  <title id="title">Liner Notes record sleeve</title>
  <desc id="description">Peach lettering on a deep blue sleeve. A black vinyl record sits inside overlapping pink, orange and turquoise sound waves.</desc>
  <defs>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#192d49"/><stop offset="1" stop-color="#302341"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffbc85"/><stop offset="1" stop-color="#f383ad"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67d8da"/><stop offset="0.5" stop-color="#f4a1ca"/><stop offset="1" stop-color="#ffc58f"/>
    </linearGradient>
    <radialGradient id="vinyl">
      <stop stop-color="#27344b"/><stop offset="0.6" stop-color="#101b2c"/><stop offset="1" stop-color="#080e19"/>
    </radialGradient>
    <pattern id="grain" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="0.7" fill="#fff" opacity="0.11"/>
      <circle cx="17" cy="13" r="0.6" fill="#fff" opacity="0.08"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="560" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="560" fill="url(#sleeve)"/>
    <rect width="1600" height="560" fill="url(#grain)"/>
    <circle cx="1490" cy="44" r="335" fill="#e888b0" opacity="0.13"/>
    <circle cx="1120" cy="390" r="237" fill="#67d8da" opacity="0.14"/>
    <path d="M840 560V105Q840 61 884 61H1530V560" fill="none" stroke="#f4a1ca" stroke-width="2" opacity="0.4"/>
    <path d="M891 560V149Q891 104 936 104H1600" fill="none" stroke="#ffc58f" stroke-width="2" opacity="0.3"/>
    <g font-family="Arial, Helvetica, sans-serif" fill="#ffe0bb">
      <text x="91" y="213" font-size="158" font-weight="800" letter-spacing="-9">Liner</text>
      <text x="91" y="367" font-size="158" font-weight="800" letter-spacing="-9">Notes.</text>
      <text x="100" y="432" font-size="25" fill="#e7e9f1">A little curiosity. A new favorite song.</text>
    </g>
    <g transform="translate(1220 282)">
      <circle r="218" fill="#080e19" opacity="0.2" transform="translate(13 16)"/>
      <circle r="215" fill="url(#vinyl)" stroke="#5a6378" stroke-width="1"/>
      <g fill="none" stroke="#718096" stroke-width="1" opacity="0.24">
        <circle r="203"/><circle r="194"/><circle r="185"/><circle r="176"/>
        <circle r="167"/><circle r="158"/><circle r="149"/><circle r="140"/>
        <circle r="131"/><circle r="122"/><circle r="113"/><circle r="104"/>
      </g>
      <path d="M-171-127A213 213 0 0 1-68-202L-25-83A87 87 0 0 0-70-50Z" fill="#d5edf7" opacity="0.09"/>
      <path d="M171 127A213 213 0 0 1 68 202L25 83A87 87 0 0 0 70 50Z" fill="#d5edf7" opacity="0.07"/>
      <circle r="85" fill="url(#label)"/>
      <circle r="73" fill="none" stroke="#53374c" opacity="0.25"/>
      <path d="M-42-24H42M-30-12H30" stroke="#492c47" stroke-width="4" stroke-linecap="round"/>
      <g fill="none" stroke="#492c47" stroke-width="3.5" stroke-linecap="round">
        <path d="M-38 26V8M-27 32V2M-16 37V-2M-5 28V7M6 31V4M17 39V-4M28 32V3M39 25V9"/>
      </g>
      <circle r="6" fill="#182a43"/>
    </g>
    <g fill="none" stroke="url(#wave)" stroke-linecap="round" stroke-width="4">
      <path d="M101 493H453C469 493 474 481 484 481S500 505 509 505S525 477 534 477S550 516 559 516S575 460 584 460S600 520 609 520S625 478 634 478S649 493 661 493H756"/>
      <path d="M798 354Q840 354 858 301T894 354T930 407T966 270" opacity="0.9"/>
    </g>
    <g fill="#ffe0bb">
      <path d="M754 138V157M745 147.5H764" stroke="#67d8da" stroke-width="3"/>
      <circle cx="725" cy="363" r="4" fill="#f4a1ca"/>
      <circle cx="1484" cy="457" r="5" fill="#67d8da"/>
    </g>
  </g>
</svg>
