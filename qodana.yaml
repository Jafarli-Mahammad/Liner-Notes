# https://www.jetbrains.com/help/qodana/dotnet.html
version: "1.0"

# Run in native mode in GitHub Actions with the SDK pinned in global.json.
# Requires a Qodana Cloud project token with a compatible .NET linter license.
linter: jetbrains/qodana-dotnet:2026.2

profile:
  name: qodana.recommended

dotnet:
  solution: Liner Notes.sln
  configuration: Release

bootstrap: |
  set -eu
  export DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1
  dotnet restore 'Liner Notes.sln' --locked-mode
  dotnet build 'Liner Notes.sln' --configuration Release --no-restore -m:1

# Report the initial findings before choosing a blocking issue threshold.
